<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <link rel="icon" type="image/png" href="/branding/favicon.png" />
    <link rel="apple-touch-icon" href="/branding/apple-touch-icon.png" />
    <meta name="description" content="Plataforma unificada de gestão de Facilities" />
    <title>Facil - Gestão de Facilities</title>
    <script>
      // Evita "piscar" o tema Clássico antes do aplicativo carregar: o último
      // tema efetivo fica em localStorage e o valor real (sessão ou padrão do
      // sistema) é aplicado logo depois pelo cliente. Sem internet ou sem a
      // chave, o padrão continua valendo.
      try {
        var savedTheme = localStorage.getItem("facil.theme");
        if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
      } catch (error) {
        /* navegador sem localStorage: segue com o tema padrão */
      }
    </script>
    <!--
      Fontes dos temas (Clássico/Noturno: Inter; Corporativo: IBM Plex Sans;
      Violeta: Manrope; Âmbar: Nunito Sans). Cada navegador baixa apenas a
      família em uso; sem internet, as pilhas de fallback do CSS assumem.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Nunito+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <!--
        Tela de abertura (D-28): aparece antes do primeiro JavaScript e some
        quando o aplicativo monta. A imagem já traz o logo e o "Carregando...".
      -->
      <style>
        #boot-splash {
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #0f172a;
        }
        #boot-splash img {
          width: auto;
          height: auto;
          max-width: min(92vw, 620px);
          max-height: 92vh;
          border-radius: 1rem;
        }
      </style>
      <div id="boot-splash">
        <img src="/branding/splash.webp" alt="Corp Services — carregando o Facil" />
      </div>
    </div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
