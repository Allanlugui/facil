<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <link rel="icon" type="image/png" href="/branding/favicon.png" />
    <link rel="apple-touch-icon" href="/branding/apple-touch-icon.png" />
    <meta name="description" content="Plataforma unificada de gestão de Facilities" />
    <meta name="author" content="Allan Luiz Silveira Lima" />
    <title>Facil - Gestão de Facilities</title>
    <script src="/theme-boot.js"></script>
    <!--
      Fontes dos temas (Clássico/Noturno: Inter; Corporativo: IBM Plex Sans;
      Violeta: Manrope; Âmbar: Nunito Sans). Cada navegador baixa apenas a
      família em uso; sem internet, as pilhas de fallback do CSS assumem.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Nunito+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <!--
        Tela de abertura (D-28): aparece antes do primeiro JavaScript e some
        quando o aplicativo monta. Usa o logo da marca (sem dependência de arte
        vertical) e respeita `prefers-reduced-motion`.
      -->
      <style>
        #boot-splash {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 18px;
          background: #0f172a;
        }
        #boot-splash img {
          width: 190px;
          height: auto;
        }
        #boot-splash p {
          margin: 0;
          color: #94a3b8;
          font: 500 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        #boot-splash i {
          width: 22px;
          height: 22px;
          border-radius: 999px;
          border: 2px solid rgba(148, 163, 184, 0.35);
          border-top-color: #f97316;
          animation: boot-spin 0.8s linear infinite;
        }
        @keyframes boot-spin {
          to {
            transform: rotate(360deg);
          }
        }
        @media (prefers-reduced-motion: reduce) {
          #boot-splash i {
            animation: none;
          }
        }
      </style>
      <div id="boot-splash">
        <img src="/branding/logo-dark.webp" alt="Corp Services" />
        <i></i>
        <p>Carregando o Facil...</p>
      </div>
    </div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
